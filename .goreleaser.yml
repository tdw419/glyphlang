version: 2

project_name: glyph

before:
  hooks:
    - go mod tidy

builds:
  - id: glyph
    main: ./cmd/glyph
    binary: glyph
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - examples/**/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Revert

dockers:
  - image_templates:
      - "ghcr.io/tdw419/glyph:{{ .Version }}-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
  - image_templates:
      - "ghcr.io/tdw419/glyph:{{ .Version }}-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

docker_manifests:
  - name_template: "ghcr.io/tdw419/glyph:{{ .Version }}"
    image_templates:
      - "ghcr.io/tdw419/glyph:{{ .Version }}-amd64"
      - "ghcr.io/tdw419/glyph:{{ .Version }}-arm64"
  - name_template: "ghcr.io/tdw419/glyph:latest"
    image_templates:
      - "ghcr.io/tdw419/glyph:{{ .Version }}-amd64"
      - "ghcr.io/tdw419/glyph:{{ .Version }}-arm64"

release:
  github:
    owner: tdw419
    name: glyphlang
  prerelease: auto
  mode: replace
  draft: false
